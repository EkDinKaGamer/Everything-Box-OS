name: Gemini Assistant Workflow

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# Grant permission to post comments on Issues and Pull Requests
permissions:
  issues: write
  pull-requests: write

jobs:
  gemini-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate and Post Gemini Comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: |
          # 1. Format the prompt payload for Gemini 2.5 Flash
          PROMPT="You are an expert AI code reviewer. Analyze this issue/PR title and body, then provide a friendly, helpful, and concise response or action plan.\n\nTitle: $TITLE\nBody:\n$BODY"
          
          # Escape quotes and backslashes for JSON compatibility
          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          # 2. Call Gemini API and extract response text
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          AI_COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Sorry, I could not generate a response."')

          # 3. Post the response back to the GitHub Issue/PR via GitHub CLI
          gh issue comment "$ISSUE_URL" --body "🤖 **Gemini AI Assistant Response:**

          $AI_COMMENT"
